name: Build Uptime Kuma

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Uptime Kuma version (e.g. 2.5.5)'
        required: true
        default: '2.5.5'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download & Build Uptime Kuma
        run: |
          VERSION=${{ github.event.inputs.version }}
          echo "Building Uptime Kuma v${VERSION}..."
          
          # Download source
          curl -sL "https://github.com/louislam/uptime-kuma/archive/refs/tags/${VERSION}.tar.gz" | tar xz
          mv "uptime-kuma-${VERSION}" app
          cd app
          
          # Install ALL deps (including dev for build)
          npm install
          
          # Build frontend
          npx vite build --config ./config/vite.config.js
          
          # Remove dev deps after build
          npm prune --omit=dev
          
          cd ..
          
          # Package
          tar czf "uptime-kuma-${VERSION}-linux-x64.tar.gz" -C app .
          echo "Archive: $(ls -lh uptime-kuma-${VERSION}-linux-x64.tar.gz)"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Uptime Kuma v${{ github.event.inputs.version }}
          files: uptime-kuma-${{ github.event.inputs.version }}-linux-x64.tar.gz
          draft: false
          prerelease: false
